apply plugin: 'com.android.application'

android {
    namespace "com.thor.mph"
    compileSdkVersion 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "com.thor.mph"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 8
        versionName "0.2.5"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a'
                // Gradle's debug variant compiles native code at -O0, which is
                // ruinous for the recompiled ARM banks (they ARE the CPU
                // emulation). Force -O2 so on-device speed matches the -O2
                // desktop build.
                cFlags "-O2", "-DNDEBUG"
                cppFlags "-O2", "-DNDEBUG"
            }
        }
    }
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.12.0'
}
